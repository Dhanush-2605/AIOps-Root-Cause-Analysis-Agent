server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Node.js chaos-test backend — its routes already start with /api/...,
    # so we forward the full path through unchanged.
    location /api/ {
        proxy_pass http://backend-service:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Python agent (FastAPI/LangGraph) — its routes have no prefix
    # (/alert, /alerts, /incidents, /approve). The trailing slash on both
    # the location and proxy_pass strips "/agent" before forwarding, so
    # /agent/incidents on the wire becomes /incidents at the agent.
    location /agent/ {
        proxy_pass http://python-agent-service:5000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}