---


apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: default
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      containers:
      - name: payment-container
        # Mocking a Node.js app choking on a degraded 3rd-party API
        image: busybox
        command: 
          - "/bin/sh"
          - "-c"
          - "while true; do echo '[WARN] Event loop lag > 5000ms. 3rd-party stripe_api requests hanging.'; sleep 4; done"
        resources:
          requests:
            cpu: "250m"
            memory: "256Mi"
          limits:
            cpu: "250m"
            memory: "256Mi"