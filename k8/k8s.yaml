  # ==========================================================================
  # PART 4: THE DATABASE CLUSTER (POSTGRESQL STATEFULSET)
  # ==========================================================================
#   apiVersion: v1
#   kind: Service
#   metadata:
#     name: postgres-headless
#   spec:
#     clusterIP: None # Disables standard load balancing for direct Pod IP addressing
#     ports:
#     - port: 5432
#     selector:
#       app: postgres
# ---

apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres-headless"
  replicas: 2   # postgres-0 = master, postgres-1 = replica
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: postgres
        image: docker.io/bitnamilegacy/postgresql:15.8.0-debian-12-r3
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
        command:
          - /bin/bash
          - -c
          - |
            SECRET_FILE=/mnt/secrets/app-env

            # Works for both formats: DB_PASSWORD=xyz line OR raw password only
            if grep -q '^DB_PASSWORD=' "$SECRET_FILE"; then
              PW=`grep '^DB_PASSWORD=' "$SECRET_FILE" | head -1 | cut -d= -f2- | tr -d '"\r\n'`
            else
              PW=`tr -d '\r\n' < "$SECRET_FILE"`
            fi
            export POSTGRESQL_PASSWORD="$PW"

            if [[ "$HOSTNAME" == "postgres-0" ]]; then
              echo "Booting as MASTER: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="master"
            else
              echo "Booting as REPLICA: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="slave"
              export POSTGRESQL_MASTER_HOST="postgres-0.postgres-headless"
              export POSTGRESQL_MASTER_PORT_NUMBER="5432"
            fi

            exec /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh
        env:
        - name: POSTGRESQL_REPLICATION_USER
          value: "repl_user"
        - name: POSTGRESQL_REPLICATION_PASSWORD_FILE
          value: "/mnt/secrets/repl-password"
        - name: POSTGRESQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
        - name: data
          mountPath: /bitnami/postgresql
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-db-provider"
  volumeClaimTemplates:
  - metadata:
      name: data
    spec:
      accessModes: [ "ReadWriteOnce" ]
      resources:
        requests:
          storage: 1Gi
---
  # ==========================================================================
  # PART 3: THE TRAFFIC COP (PGPOOL-II PROXY)
  # ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgpool
  template:
    metadata:
      labels:
        app: pgpool
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: pgpool
        image: docker.io/bitnamilegacy/pgpool:4.6.3-debian-12-r0
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
        command:
          - /bin/bash
          - -c
          - |
            SECRET_FILE=/mnt/secrets/app-env

            if grep -q '^DB_PASSWORD=' "$SECRET_FILE"; then
              PW=`grep '^DB_PASSWORD=' "$SECRET_FILE" | head -1 | cut -d= -f2- | tr -d '"\r\n'`
            else
              PW=`tr -d '\r\n' < "$SECRET_FILE"`
            fi
            export PGPOOL_POSTGRES_PASSWORD="$PW"
            export PGPOOL_SR_CHECK_PASSWORD="$PW"
            export PGPOOL_HEALTH_CHECK_PASSWORD="$PW"

            exec /opt/bitnami/scripts/pgpool/entrypoint.sh /opt/bitnami/scripts/pgpool/run.sh
        env:
        - name: PGPOOL_BACKEND_NODES
          value: "0:postgres-0.postgres-headless:5432,1:postgres-1.postgres-headless:5432"
        - name: PGPOOL_ENABLE_LOAD_BALANCING
          value: "yes"
        - name: PGPOOL_POSTGRES_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_SR_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_HEALTH_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_ADMIN_USERNAME
          value: "admin"
        - name: PGPOOL_ADMIN_PASSWORD_FILE
          value: "/mnt/secrets/pgpool-admin-password"
        volumeMounts:
        - name: secrets-store
          mountPath: /mnt/secrets
          readOnly: true
      volumes:
      - name: secrets-store
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-db-provider"
---
  apiVersion: v1
  kind: Service
  metadata:
    name: pgpool-service
  spec:
    ports:
    - port: 5432
      name: postgres
    selector:
      app: pgpool
---
# ==========================================
# TIER 2: BACKEND (Node.js API)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-sa # <--- Wears the exact same ID badge
      containers:
      - name: backend
        image: BACKEND_IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config         # <--- Pulls the host routing data
        volumeMounts:
        - mountPath: /mnt/secrets    # <--- Mounts the exact same  secret file
          name: secret-volume
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m" 
          limits:
            memory: "512Mi"
            cpu: "300m"
       
      volumes:
      - name: secret-volume
        csi:   
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http-metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
---
# ==========================================
# TIER 1: FRONTEND (React UI)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: FRONTEND_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
       
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
