# ==========================================
# 1. DATABASE INIT SCRIPT (1 Million Rows)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    -- Create the table structure so the backend can write immediately
    CREATE TABLE IF NOT EXISTS employee_data (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100),
        department VARCHAR(50),
        salary INT,
        join_date DATE
    );

    -- Keep the B-tree index so your SELECT queries are optimized from day one
    CREATE INDEX IF NOT EXISTS idx_department_salary ON employee_data USING btree (department, salary);
---
# ==========================================
# CONFIGURATIONS, SECRETS & IDENTITIES (NEW)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Node.js now talks to the Proxy, NOT the database directly!
  DB_HOST: "pgpool-service"

  # We also tell Node.js where the Redis queue is
  REDIS_HOST: "redis-service"

  DB_USER: "postgres"
  DB_NAME: "mytierdb"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "mytierdb"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: default
  annotations:
    # The Workload Identity Bridge to Azure Managed Identity
    azure.workload.identity/client-id: "6695b889-efa8-498a-9d91-04c84a03235e"
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-provider
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "6695b889-efa8-498a-9d91-04c84a03235e"
    keyvaultName: "kv-doom-secrets1"
    tenantId: "460e9a4b-7c0a-4b4f-8241-502b2cb1f3c4"
    objects: |
      array:
        - |
          objectName: db-password
          objectType: secret
        - |
          objectName: app-env
          objectType: secret
        - |
          objectName: github-token            # 1. Fetch secret from Azure Key Vault
          objectType: secret

  secretObjects:
  - secretName: agent-kv-secrets
    type: Opaque
    data:
    - key: DB_PASSWORD
      objectName: db-password
    - key: GROQ_API_KEY                     # <--- 2. Maps to process environment variable name
      objectName: groq-api-ke
    - key: GITHUB_TOKEN                      # 2. Expose as env variable GITHUB_TOKEN
      objectName: github-token
---
# ==========================================
# TIER 3: DATABASE (PostgreSQL)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
# ==========================================================================
# PART 4: THE DATABASE CLUSTER (POSTGRESQL STATEFULSET)
# ==========================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None # Disables standard load balancing for direct Pod IP addressing
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres-headless"
  replicas: 2 # Generates postgres-0 (Master) and postgres-1 (Replica)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: postgres
        image: docker.io/bitnamilegacy/postgresql:15.8.0-debian-12-r3
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
       

        # Dynamic Bootstrap Interceptor Script
        command:
          - /bin/bash
          - -c
          - |
            if [[ "$HOSTNAME" == "postgres-0" ]]; then
              echo "Booting as MASTER: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="master"
            else
              echo "Booting as REPLICA: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="slave"
              export POSTGRESQL_MASTER_HOST="postgres-0.postgres-headless"
              export POSTGRESQL_MASTER_PORT_NUMBER="5432"
            fi

            # Exec pass-through back to the base entrypoint
            exec /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh

        env:
        - name: POSTGRESQL_REPLICATION_USER
          value: "repl_user"
        - name: POSTGRESQL_REPLICATION_PASSWORD
          value: "repl_password123"
        - name: POSTGRESQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: POSTGRESQL_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"

        volumeMounts:
        - mountPath: /mnt/secrets
          name: gcp-secret-volume
          readOnly: true
      volumes:
      - name: gcp-secret-volume
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-db-credentials"
      - name: postgres-init-volume
        configMap:
          name: postgres-init-script
---
# ==========================================================================
# PART 3: THE TRAFFIC COP (PGPOOL-II PROXY)
# ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgpool
  template:
    metadata:
      labels:
        app: pgpool
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: pgpool
        image: docker.io/bitnamilegacy/pgpool:4.6.3-debian-12-r0
        ports:
        - containerPort: 5432
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "300m"
       
        env:
        # Backend mapping using the Headless service DNS structures
        - name: PGPOOL_BACKEND_NODES
          value: "0:postgres-0.postgres-headless:5432,1:postgres-1.postgres-headless:5432"

        # Enable SQL parsing and Read/Write splitting
        - name: PGPOOL_ENABLE_LOAD_BALANCING
          value: "yes"

        - name: PGPOOL_POSTGRES_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER

        - name: PGPOOL_SR_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_SR_CHECK_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"

        - name: PGPOOL_HEALTH_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_HEALTH_CHECK_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"

        - name: PGPOOL_POSTGRES_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"
        - name: PGPOOL_ADMIN_USERNAME
          value: "admin"
        - name: PGPOOL_ADMIN_PASSWORD
          value: "admin123"
        volumeMounts:
        - mountPath: /mnt/secrets
          name: gcp-secret-volume
          readOnly: true
      volumes:
      - name: gcp-secret-volume
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-db-credentials"
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-service
spec:
  ports:
  - port: 5432
    name: postgres
  selector:
    app: pgpool
---
# ==========================================
# TIER 2: BACKEND (Node.js API)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: backend-sa # <--- Wears the exact same ID badge
      containers:
      - name: backend
        image: BACKEND_IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config         # <--- Pulls the host routing data
        volumeMounts:
        - mountPath: /mnt/secrets    # <--- Mounts the exact same  secret file
          name: secret-volume
          readOnly: true
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m" 
          limits:
            memory: "512Mi"
            cpu: "300m"
       
      volumes:
      - name: secret-volume
        csi:   
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
  - name: http-metrics
    port: 3000
    targetPort: 3000
    protocol: TCP
---
# ==========================================
# TIER 1: FRONTEND (React UI)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: FRONTEND_IMAGE_PLACEHOLDER
        ports:
        - containerPort: 80
        resources:
          requests:
            memory: "128Mi"
            cpu: "50m"
          limits:
            memory: "256Mi"
            cpu: "200m"
       
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
