---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: python-chaos-agent
  namespace: default
  labels:
    app: python-chaos-agent
spec:
  replicas: 1
  selector:
    matchLabels:
      app: python-chaos-agent
  template:
    metadata:
      labels:
        app: python-chaos-agent
    spec:
      containers:
      - name: agent
        # Replace this with your actual image name
        image: acrnodejsapprepo.azurecr.io/python:067bd2a8edcc50fa1c04753986bd033a8296a456
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http-web
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
            
        # envFrom:
        # - secretRef:
        #     name: agent-kv-secrets
        # 4. CSI Volume Mount (Mandatory for Key Vault fetch to trigger on pod startup)
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      # 5. Define CSI Volume referencing the SecretProviderClass
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-kv-provider"
---
apiVersion: v1
kind: Service
metadata:
  name: python-agent-service
  namespace: default
spec:
  selector:
    app: python-chaos-agent
  ports:
    - protocol: TCP
      port: 5000             # The port Alertmanager is sending traffic to
      targetPort: 8000       # Forwards traffic to your FastAPI container port




    
 
     