# ==========================================
# 1. DATABASE INIT SCRIPT (1 Million Rows)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    -- Create the table structure so the backend can write immediately
    CREATE TABLE IF NOT EXISTS employee_data (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100),
        department VARCHAR(50),
        salary INT,
        join_date DATE
    );

    -- Keep the B-tree index so your SELECT queries are optimized from day one
    CREATE INDEX IF NOT EXISTS idx_department_salary ON employee_data USING btree (department, salary);
---
# ==========================================
# CONFIGURATIONS, SECRETS & IDENTITIES (NEW)
# ==========================================
  apiVersion: v1
  kind: ConfigMap
  metadata:
    name: app-config
  data:
    # Node.js now talks to the Proxy, NOT the database directly!
    DB_HOST: "pgpool-service"

    # We also tell Node.js where the Redis queue is
    REDIS_HOST: "redis-service"

    DB_USER: "postgres"
    DB_NAME: "mytierdb"
    POSTGRES_USER: "postgres"
    POSTGRES_DB: "mytierdb"
---
  apiVersion: v1
  kind: ServiceAccount
  metadata:
    name: backend-sa
    namespace: default
    annotations:
      # The Workload Identity Bridge to Azure Managed Identity
      azure.workload.identity/client-id: "6695b889-efa8-498a-9d91-04c84a03235e"
---
  apiVersion: secrets-store.csi.x-k8s.io/v1
  kind: SecretProviderClass
  metadata:
    name: azure-kv-provider
    namespace: default
  spec:
    provider: azure
    parameters:
      usePodIdentity: "false"
      useVMManagedIdentity: "true"
      userAssignedIdentityID: "5cd6ea91-933c-43fe-ade6-0d348d861506"
      clientID: "6695b889-efa8-498a-9d91-04c84a03235e"
      keyvaultName: "kv-doom-secrets1"
      tenantId: "460e9a4b-7c0a-4b4f-8241-502b2cb1f3c4"
      objects: |
        array:
          - |
            objectName: app-env
            objectType: secret

---

   
# NEW: used only by node, postgres and pgpool (Workload Identity auth)
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-kv-db-provider
  namespace: default
spec:
  provider: azure
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "false"
    clientID: "6695b889-efa8-498a-9d91-04c84a03235e"
    keyvaultName: "kv-doom-secrets1"
    tenantId: "460e9a4b-7c0a-4b4f-8241-502b2cb1f3c4"
    objects: |
      array:
        - |
          objectName: app-env
          objectType: secret
        - |
          objectName: pg-repl-password
          objectType: secret
          objectAlias: repl-password
        - |
          objectName: pgpool-admin-password
          objectType: secret
          objectAlias: pgpool-admin-password

---
  # ==========================================
  # TIER 3: DATABASE (PostgreSQL)
  # ==========================================
