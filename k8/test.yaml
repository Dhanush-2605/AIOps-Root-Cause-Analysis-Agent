apiVersion: v1
kind: Pod
metadata:
  name: nodejs-block-test
  labels:
    app: rca-test
spec:
  containers:
  - name: node
    image: node:18-alpine
    command: ["node", "-e", `
      const http = require('http');
      let isBlocked = false;

      const server = http.createServer((req, res) => {
        if (req.url === '/block') {
          isBlocked = true;
          res.end('Event loop blocked for 40 seconds!\n');
          // Heavy CPU-bound synchronous loop locking the thread
          const start = Date.now();
          while (Date.now() - start < 40000) {
            // synchronous blocking
          }
          isBlocked = false;
          return;
        }

        if (isBlocked) {
          // Will not even reach here because the event loop is frozen, 
          // causing the HTTP request to hang and timeout.
          res.writeHead(503);
          res.end('Busy\n');
        } else {
          res.writeHead(200);
          res.end('OK\n');
        }
      });

      server.listen(3000);
    `]
    readinessProbe:
      httpGet:
        path: /
        port: 3000
      periodSeconds: 5
      timeoutSeconds: 2
      failureThreshold: 1
    ports:
    - containerPort: 3000