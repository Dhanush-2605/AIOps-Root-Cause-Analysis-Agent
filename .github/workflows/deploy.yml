name: Build and Deploy 3-Tier App

on:
  workflow_dispatch:

# These values are written to the repo's Actions variables by Terraform (terraform/github.tf)
env:
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  CLUSTER_NAME: ${{ vars.CLUSTER_NAME }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  KEYVAULT_NAME: ${{ vars.KEYVAULT_NAME }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  BACKEND_CLIENT_ID: ${{ vars.BACKEND_CLIENT_ID }}
  CSI_IDENTITY_CLIENT_ID: ${{ vars.CSI_IDENTITY_CLIENT_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Docker Auth
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Backend Image
        run: |
          BACKEND_TAG="${{ env.ACR_LOGIN_SERVER }}/backend:${GITHUB_SHA}"
          docker build -t $BACKEND_TAG ./backend
          docker push $BACKEND_TAG
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

      - name: Build and Push Python Image
        run: |
          PYTHON_TAG="${{ env.ACR_LOGIN_SERVER }}/python:${GITHUB_SHA}"
          docker build -t $PYTHON_TAG ./Agent
          docker push $PYTHON_TAG
          echo "PYTHON_TAG=$PYTHON_TAG" >> $GITHUB_ENV

      - name: Build and Push Frontend Image
        run: |
          FRONTEND_TAG="${{ env.ACR_LOGIN_SERVER }}/frontend:${GITHUB_SHA}"
          docker build -t $FRONTEND_TAG ./frontend
          docker push $FRONTEND_TAG
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV

      - name: Connect to AKS Cluster
        run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing --admin

      - name: Create monitoring namespace and Postgres exporter secret
        run: |
          DB_PASSWORD=$(az keyvault secret show --vault-name "${{ env.KEYVAULT_NAME }}" --name app-env --query value -o tsv \
            | grep '^DB_PASSWORD=' | head -1 | cut -d= -f2- | tr -d '\r\n"')
          [ -n "$DB_PASSWORD" ] || { echo "DB_PASSWORD not found in Key Vault secret app-env"; exit 1; }
          echo "::add-mask::$DB_PASSWORD"
          kubectl create namespace monitoring --dry-run=client -o yaml | kubectl apply -f -
          kubectl create secret generic pg-exporter-secret -n monitoring \
            --from-literal=password="$DB_PASSWORD" --dry-run=client -o yaml | kubectl apply -f -

      - name: Deploy to AKS
        run: |
          sed -i "s|BACKEND_IMAGE_PLACEHOLDER|${{ env.BACKEND_TAG }}|g" k8/k8s.yaml
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ env.FRONTEND_TAG }}|g" k8/k8s.yaml
          sed -i "s|PYTHON_IMAGE_PLACEHOLDER|${{ env.PYTHON_TAG }}|g" k8/k8s.yaml
          sed -i "s|BACKEND_CLIENT_ID_PLACEHOLDER|${{ env.BACKEND_CLIENT_ID }}|g" k8/k8s.yaml
          sed -i "s|CSI_IDENTITY_CLIENT_ID_PLACEHOLDER|${{ env.CSI_IDENTITY_CLIENT_ID }}|g" k8/k8s.yaml
          sed -i "s|TENANT_ID_PLACEHOLDER|${{ env.AZURE_TENANT_ID }}|g" k8/k8s.yaml
          sed -i "s|KEYVAULT_NAME_PLACEHOLDER|${{ env.KEYVAULT_NAME }}|g" k8/k8s.yaml

      - name: Deploy Prometheus Stack via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f helm/values.yaml \
            --atomic \
            --timeout 10m

      - name: Apply Custom Manifests
        run: |
          kubectl apply -f k8/

      - name: Deploy Postgres Exporter via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update
          helm upgrade --install pg-exporter prometheus-community/prometheus-postgres-exporter \
            --namespace monitoring \
            -f helm/exporter-values.yaml \
            --atomic \
            --timeout 5m