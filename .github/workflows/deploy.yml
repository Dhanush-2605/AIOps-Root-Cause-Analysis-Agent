name: Build and Deploy 3-Tier App

on:
  push:
    branches:
      - main

env:
  RESOURCE_GROUP: rg-production
  ACR_NAME: acrnodejsapprepo
  ACR_LOGIN_SERVER: acrnodejsapprepo.azurecr.io
  CLUSTER_NAME: aks-production-cluster
  # These three come straight from your `terraform output` (workload_identity_client_id,
  # tenant_id, subscription_id). Store them as repo secrets, not plain env vars.
  AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: 'read'
      id-token: 'write'

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ env.AZURE_CLIENT_ID }}
          tenant-id: ${{ env.AZURE_TENANT_ID }}
          subscription-id: ${{ env.AZURE_SUBSCRIPTION_ID }}

      - name: Configure Docker Auth
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and Push Backend Image
        run: |
          BACKEND_TAG="${{ env.ACR_LOGIN_SERVER }}/backend:${GITHUB_SHA}"
          docker build -t $BACKEND_TAG ./backend
          docker push $BACKEND_TAG
          echo "BACKEND_TAG=$BACKEND_TAG" >> $GITHUB_ENV

      - name: Build and Push Python Image
        run: |
          PYTHON_TAG="${{ env.ACR_LOGIN_SERVER }}/python:${GITHUB_SHA}"
          docker build -t $PYTHON_TAG ./Agent
          docker push $PYTHON_TAG
          echo "PYTHON_TAG=$PYTHON_TAG" >> $GITHUB_ENV

      - name: Build and Push Frontend Image
        run: |
          FRONTEND_TAG="${{ env.ACR_LOGIN_SERVER }}/frontend:${GITHUB_SHA}"
          docker build -t $FRONTEND_TAG ./frontend
          docker push $FRONTEND_TAG
          echo "FRONTEND_TAG=$FRONTEND_TAG" >> $GITHUB_ENV

      - name: Connect to AKS Cluster
        run: az aks get-credentials --resource-group ${{ env.RESOURCE_GROUP }} --name ${{ env.CLUSTER_NAME }} --overwrite-existing

      - name: Deploy to AKS
        run: |
          # Inject the newly built image tags into the K8s manifest
          sed -i "s|BACKEND_IMAGE_PLACEHOLDER|${{ env.BACKEND_TAG }}|g" k8/k8s.yaml
          sed -i "s|FRONTEND_IMAGE_PLACEHOLDER|${{ env.FRONTEND_TAG }}|g" k8/k8s.yaml
          sed -i "s|PYTHON_IMAGE_PLACEHOLDER|${{ env.PYTHON_TAG }}|g" k8/k8s.yaml

      - name: Deploy Prometheus Stack via Helm
        run: |
          helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
          helm repo update

          helm upgrade --install prometheus-stack prometheus-community/kube-prometheus-stack \
            --namespace monitoring \
            --create-namespace \
            -f helm/values.yaml \
            --atomic \
            --timeout 10m

      - name: Apply Custom Manifests
        run: |
          kubectl apply -f k8/