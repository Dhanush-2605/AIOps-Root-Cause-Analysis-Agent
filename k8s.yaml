# ==========================================
# 1. DATABASE INIT SCRIPT (1 Million Rows)
# ==========================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init-script
data:
  init.sql: |
    -- Create the table structure so the backend can write immediately
    CREATE TABLE IF NOT EXISTS employee_data (
        id SERIAL PRIMARY KEY,
        name VARCHAR(100),
        department VARCHAR(50),
        salary INT,
        join_date DATE
    );

    -- Keep the B-tree index so your SELECT queries are optimized from day one
    CREATE INDEX IF NOT EXISTS idx_department_salary ON employee_data USING btree (department, salary);
---

# ==========================================
# CONFIGURATIONS, SECRETS & IDENTITIES (NEW)
# ==========================================



apiVersion: v1
kind: ConfigMap
metadata:
  name: app-config
data:
  # Node.js now talks to the Proxy, NOT the database directly!
  DB_HOST: "pgpool-service" 
  
  # We also tell Node.js where the Redis queue is
  REDIS_HOST: "redis-service" 
  
  DB_USER: "postgres"
  DB_NAME: "mytierdb"
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "mytierdb"
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  annotations:
    # The Workload Identity Bridge to Google Cloud
    iam.gke.io/gcp-service-account: "backend-db-accessor@core-appliance-338915.iam.gserviceaccount.com"

    
---
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: gcp-db-credentials
spec:
  provider: gke
  parameters:
    secrets: |
      - resourceName: "projects/core-appliance-338915/secrets/db-password/versions/latest"
        path: "db-password.txt"

---
# ==========================================
# TIER 3: DATABASE (PostgreSQL)
# ==========================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-pvc
spec:
  accessModes: [ "ReadWriteOnce" ]
  resources:
    requests:
      storage: 1Gi
---
# ==========================================================================
# PART 4: THE DATABASE CLUSTER (POSTGRESQL STATEFULSET)
# ==========================================================================
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
spec:
  clusterIP: None # Disables standard load balancing for direct Pod IP addressing
  ports:
  - port: 5432
  selector:
    app: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  serviceName: "postgres-headless"
  replicas: 2 # Generates postgres-0 (Master) and postgres-1 (Replica)
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: postgres
        image: docker.io/bitnamilegacy/postgresql:15.8.0-debian-12-r3
        ports:
        - containerPort: 5432
        
        # Dynamic Bootstrap Interceptor Script
        command:
          - /bin/bash
          - -c
          - |
            if [[ "$HOSTNAME" == "postgres-0" ]]; then
              echo "Booting as MASTER: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="master"
            else
              echo "Booting as REPLICA: $HOSTNAME"
              export POSTGRESQL_REPLICATION_MODE="slave"
              export POSTGRESQL_MASTER_HOST="postgres-0.postgres-headless"
              export POSTGRESQL_MASTER_PORT_NUMBER="5432"
            fi
            
            # Exec pass-through back to the base entrypoint
            exec /opt/bitnami/scripts/postgresql/entrypoint.sh /opt/bitnami/scripts/postgresql/run.sh
        
        env:
        - name: POSTGRESQL_REPLICATION_USER
          value: "repl_user"
        - name: POSTGRESQL_REPLICATION_PASSWORD
          value: "repl_password123"
        - name: POSTGRESQL_DATABASE
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: DB_NAME
        - name: POSTGRESQL_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"
          
        volumeMounts:
        - mountPath: /mnt/secrets    
          name: gcp-secret-volume
          readOnly: true
      volumes:
      - name: gcp-secret-volume
        csi:                         
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-db-credentials"
      - name: postgres-init-volume
        configMap:
          name: postgres-init-script
---


# ==========================================================================
# PART 3: THE TRAFFIC COP (PGPOOL-II PROXY)
# ==========================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pgpool
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pgpool
  template:
    metadata:
      labels:
        app: pgpool
    spec:
      serviceAccountName: backend-sa
      containers:
      - name: pgpool
        image: docker.io/bitnamilegacy/pgpool:4.6.3-debian-12-r0
        ports:
        - containerPort: 5432
        env:
        # Backend mapping using the Headless service DNS structures
        - name: PGPOOL_BACKEND_NODES
          value: "0:postgres-0.postgres-headless:5432,1:postgres-1.postgres-headless:5432"
        
        # Enable SQL parsing and Read/Write splitting
        - name: PGPOOL_ENABLE_LOAD_BALANCING
          value: "yes"
        
        - name: PGPOOL_POSTGRES_USERNAME
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        
        - name: PGPOOL_SR_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_SR_CHECK_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"

        - name: PGPOOL_HEALTH_CHECK_USER
          valueFrom:
            configMapKeyRef:
              name: app-config
              key: POSTGRES_USER
        - name: PGPOOL_HEALTH_CHECK_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"

        - name: PGPOOL_POSTGRES_PASSWORD_FILE
          value: "/mnt/secrets/db-password.txt"
        - name: PGPOOL_ADMIN_USERNAME
          value: "admin"
        - name: PGPOOL_ADMIN_PASSWORD
          value: "admin123"
        volumeMounts:
        - mountPath: /mnt/secrets    
          name: gcp-secret-volume
          readOnly: true
      volumes:
      - name: gcp-secret-volume
        csi:                         
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-db-credentials"
---
apiVersion: v1
kind: Service
metadata:
  name: pgpool-service
spec:
  ports:
  - port: 5432
    name: postgres
  selector:
    app: pgpool
---



# ==========================================
# TIER 2: BACKEND (Node.js API)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      serviceAccountName: backend-sa # <--- Wears the exact same ID badge
      containers:
      - name: backend
        image: BACKEND_IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 8080
        envFrom:
        - configMapRef:
            name: app-config         # <--- Pulls the host routing data
        volumeMounts:
        - mountPath: /mnt/secrets    # <--- Mounts the exact same GCP secret file
          name: gcp-secret-volume
          readOnly: true
      volumes:
      - name: gcp-secret-volume
        csi:
          driver: secrets-store-gke.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "gcp-db-credentials"
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP 
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080

---

# ==========================================
# TIER 1: FRONTEND (React UI)
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        image: FRONTEND_IMAGE_PLACEHOLDER 
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
spec:
  type: LoadBalancer 
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80

---

# ==========================================
# 4. THE SHOCK ABSORBER: Redis Message Queue
# ==========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis-queue
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      containers:
      - name: redis
        image: redis:7-alpine
        ports:
        - containerPort: 6379
---
apiVersion: v1
kind: Service
metadata:
  name: redis-service
spec:
  ports:
  - port: 6379
  selector:
    app: redis  

---

